    <meta name="description" content="Paint Keeper helps you track your miniature paint collection and wishlist. Browse Citadel, Vallejo and Army Painter paints and filter by brand, type and colour." />
    <script>
      try {
        var t = localStorage.getItem('paint-keeper-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
